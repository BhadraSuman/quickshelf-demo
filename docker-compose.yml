services:
  postgres:
    image: postgres:16-alpine
    container_name: quickshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickshelf
      POSTGRES_PASSWORD: quickshelf_dev
      POSTGRES_DB: quickshelf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickshelf -d quickshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickshelf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
