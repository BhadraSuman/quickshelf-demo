name: Build & Deploy to Microsoft Azure (Central India)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - 'infra/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

env:
  AZURE_REGION: centralindia
  ACR_NAME: crquickshelfprod
  RESOURCE_GROUP: rg-quickshelf-prod-centralindia

jobs:
  test:
    name: Test & Monorepo Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @quickshelf/db generate

      - name: Typecheck & Build All Packages
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test

  build-and-deploy:
    name: Build Containers & Deploy to Azure
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build & Push quickshelf-api
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-api:${{ env.IMAGE_TAG }} -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-api:latest -f apps/api/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-api:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-api:latest

      - name: Build & Push quickshelf-gateway-hub
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-gateway-hub:${{ env.IMAGE_TAG }} -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-gateway-hub:latest -f apps/gateway-hub/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-gateway-hub:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-gateway-hub:latest

      - name: Build & Push quickshelf-sync-engine
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-sync-engine:${{ env.IMAGE_TAG }} -t ${{ env.ACR_NAME }}.azurecr.io/quickshelf-sync-engine:latest -f apps/sync-engine/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-sync-engine:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/quickshelf-sync-engine:latest

      - name: Update Azure Container Apps Revisions
        run: |
          az containerapp update \
            --name ca-quickshelf-prod-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/quickshelf-api:${{ env.IMAGE_TAG }}

          az containerapp update \
            --name ca-quickshelf-prod-hub \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/quickshelf-gateway-hub:${{ env.IMAGE_TAG }}

          az containerapp update \
            --name ca-quickshelf-prod-engine \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/quickshelf-sync-engine:${{ env.IMAGE_TAG }}

      - name: Deploy Dashboard to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/dashboard'
          output_location: 'dist'
          skip_app_build: false
